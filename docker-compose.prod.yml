# Production stack (Dokploy). Env: LIVEKIT_DOMAIN, LIVEKIT_NODE_IP, LIVEKIT_API_KEY, LIVEKIT_API_SECRET,
# and for the Discord Activity: DISCORD_CLIENT_ID, DISCORD_CLIENT_SECRET, PUBLIC_URL (optional);
# PLUGINS (optional): base URLs of plugins the rooms can open, comma-separated (e.g. the hypetv service below).
# YTDLP_COOKIES (optional): a YouTube cookies.txt for the Activity's YouTube relay, e.g. /app/data/youtube-cookies.txt.
# Domains (HTTPS via Traefik): app → port 3001, livekit → port 7880 (signaling over wss), hypetv → port 3002.
# Media bypasses Traefik: 7881/tcp (ICE over TCP) and 7882/udp (UDP mux) must be open on the host.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      LIVEKIT_URL: wss://${LIVEKIT_DOMAIN}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      PLUGINS: ${PLUGINS:-}
      YTDLP_COOKIES: ${YTDLP_COOKIES:-}
    # Public resolvers: a plugin's freshly created domain resolves right away, not after the host resolver's negative cache expires.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - hypemeet-data:/app/data

  # HypeTv (plugins/hypetv): IPTV lists in the room. Its relay carries the streams, so it runs apart from the app.
  # TMDB_API_KEY (optional) finds posters lists lack; HYPETV_HOSTS (optional) limits the relay to those IPTV hosts.
  # HYPETV_LISTS (optional): lists everyone starts with, "Name|http://server:8080|user|password" (several: ";").
  # Set it in Dokploy, never in git: the login stays on this service, the page only sees "-".
  hypetv:
    build:
      context: .
      dockerfile: plugins/hypetv/Dockerfile
    restart: unless-stopped
    environment:
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      HYPETV_HOSTS: ${HYPETV_HOSTS:-}
      HYPETV_MAX_STREAMS: ${HYPETV_MAX_STREAMS:-40}
      HYPETV_LISTS: ${HYPETV_LISTS:-}
      # Films are downloaded once and shared by the room (plugins/hypetv/server/vodcache.ts).
      HYPETV_CACHE_DIR: /cache
      HYPETV_CACHE_GB: ${HYPETV_CACHE_GB:-20}
    volumes:
      - hypetv-cache:/cache
    dns:
      - 1.1.1.1
      - 8.8.8.8

  livekit:
    image: livekit/livekit-server:v1.13.7
    restart: unless-stopped
    command: --bind 0.0.0.0
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          udp_port: 7882
          node_ip: ${LIVEKIT_NODE_IP}
          use_external_ip: false
        keys:
          ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}
    ports:
      - "7881:7881/tcp"
      - "7882:7882/udp"

volumes:
  hypemeet-data:
  hypetv-cache:
